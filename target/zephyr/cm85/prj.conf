# C++ (the engine uses std::atomic, <cmath>, <cstdio> — full libstdc++).
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# I2S audio out (SSIE1 + GPT PWM MCLK; the RA drivers auto-enable).
CONFIG_I2S=y
CONFIG_PWM=y
CONFIG_I2S_INIT_PRIORITY=52

# Dual-core IPC mailbox (M33 → M85 event notification).
CONFIG_MBOX=y

# Dual-core boot: the CM85 is the RA8D2 boot core and must release the CM33
# (control/UI) core. Enables R_BSP_SecondaryCoreStart in soc_late_init_hook.
CONFIG_SOC_RA_ENABLE_START_SECOND_CORE=y
