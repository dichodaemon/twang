# C++ (the engine uses std::atomic, <cmath>, <cstdio> — full libstdc++).
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# I2S audio out (SSIE1 + GPT PWM MCLK; the RA drivers auto-enable).
CONFIG_I2S=y
CONFIG_PWM=y
CONFIG_I2S_INIT_PRIORITY=52

# Dual-core IPC mailbox (M33 → M85 event notification).
CONFIG_MBOX=y
