# C++20 — the engine/controller use std::atomic etc. (full libstdc++).
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# LVGL graphics library (Zephyr module; auto-hooks the Zephyr display via
# LV_Z_AUTO_INIT). Minimal config: only the widgets the panel UI uses — the
# scope draws with the core draw API (lv_draw_*), not the line/canvas widgets.
CONFIG_LVGL=y
CONFIG_LV_CONF_MINIMAL=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_THEME_DEFAULT=y
# Flex layout (the panel uses lv_obj_set_flex_*); disabled by LV_CONF_MINIMAL.
CONFIG_LV_USE_FLEX=y
CONFIG_LV_FONT_MONTSERRAT_10=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_12=y

# Display (Renesas GLCDC drives the 7" RGB panel).
CONFIG_DISPLAY=y
CONFIG_RENESAS_RA_GLCDC=y

# Dual-core IPC mailbox (notify the M85 after queueing events).
CONFIG_MBOX=y

# Memory: the Ui object (~160 KB of scope/fft scratch) is heap-allocated via
# new; LVGL widgets live in the LVGL pool. Both tuned on hardware bring-up.
CONFIG_HEAP_MEM_POOL_SIZE=262144
CONFIG_LV_Z_MEM_POOL_SIZE=65536

CONFIG_MAIN_STACK_SIZE=8192
