# C++20 — the engine/spike use std::atomic etc. (full libstdc++).
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# Touch input (FT5336 on iic1, via the Zephyr input subsystem).
CONFIG_INPUT=y
CONFIG_INPUT_FT5336=y

# Display (Renesas GLCDC drives the 7" RGB panel). FB_NUM=0: the application
# maintains its own two SDRAM frame buffers (see glcdc_backend.cc) and writes
# full frames via display_write (no driver-internal framebuffers).
CONFIG_DISPLAY=y
CONFIG_RENESAS_RA_GLCDC=y
CONFIG_RENESAS_RA_GLCDC_FB_NUM=0

# Dual-core IPC mailbox (notify the M85 after queueing events).
CONFIG_MBOX=y

# Memory: the Panel (~160 KB of draw scratch) is placement-new'd into SDRAM
# (see nostromo/panel.cc TWANG_UI_SDRAM); the C heap only covers residual runtime
# allocations, so it's small. Tune on hardware bring-up.
CONFIG_HEAP_MEM_POOL_SIZE=32768

CONFIG_MAIN_STACK_SIZE=8192
